plugins {
    id 'fabric-loom' version '1.17.18'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric e Mojang já são adicionados pelo Loom.
}

// Testes de jogo (item A do §8 de Project-State.md).
//
// Fonte separada de propósito: este código sobe um servidor e depende de
// Minecraft, então não é teste de unidade nem pode entrar no jar de
// release. Ver Testing-Strategy.md §3, que hoje só cobre o Core.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Unit tests cobrem apenas o Core, que não depende de Minecraft.
    // Ver Testing-Strategy.md §3.
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// `./gradlew runGametest` sobe um servidor sem cliente, monta as
// estruturas, roda as afirmações e falha o build.
//
// Existe porque a camada fabric não tinha teste nenhum, e foi nela que
// os quatro defeitos de 2026-08-07 apareceram — todos depois de uma
// sessão de jogo do autor. Ver §11.
loom {
    runs {
        gametest {
            server()
            name = 'Game Test'
            source sourceSets.gametest

            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-report.xml"

            runDir 'build/gametest'
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

// Java 21 é requisito do Minecraft 1.21.1, não preferência do projeto.
// Ver docs/technical/Fabric-Version.md §5.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
