name: CI

on:
  push:
    # O trabalho do dia vive nos branches codex/*, e ate 2026-09-24 o CI so
    # rodava na main: os commits enviados nao passavam por verificacao nenhuma.
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check whitespace
        run: git diff --check

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run unit tests
        run: ./gradlew build --rerun-tasks

      - name: Run Fabric gametests
        run: ./gradlew runGametest --rerun-tasks

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: village-colony-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            build/reports/**
            build/test-results/**
            build/gametest-report.xml
            build/gauntlet/**
          if-no-files-found: ignore
