plugins {
    id 'fabric-loom' version '1.17.18'
    id 'maven-publish'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'pmd'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric e Mojang já são adicionados pelo Loom.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
}

// Testes de jogo (item A do §8 de Project-State.md).
//
// Fonte separada de propósito: este código sobe um servidor e depende de
// Minecraft, então não é teste de unidade nem pode entrar no jar de
// release. Ver Testing-Strategy.md §3, que hoje só cobre o Core.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // API opcional do Mod Menu: fica disponível no ambiente de
    // desenvolvimento, mas não vira dependência obrigatória do mod.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Unit tests cobrem o Core, que não depende de Minecraft. Ver
    // Testing-Strategy.md §3.
    //
    // O fabric-loader-junit (2026-09-24) põe o teste dentro do carregador do
    // Fabric: com Bootstrap.bootStrap(), o teste unitário passa a poder ler
    // registro, tag e item do jogo em milissegundos, em vez de exigir um
    // teste de jogo lento e sujeito a interferência.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

    // Análise estática na compilação (2026-09-24). Ver o bloco errorprone
    // abaixo: só avisa, não reprova.
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    // Nulidade verificada na compilação (2026-09-30): NullAway sobre o Error
    // Prone, guiado pelas anotações JSpecify. Só em pacote @NullMarked.
    errorprone "com.uber.nullaway:nullaway:${project.nullaway_version}"
    compileOnly "org.jspecify:jspecify:${project.jspecify_version}"
    testCompileOnly "org.jspecify:jspecify:${project.jspecify_version}"

    // Regras de arquitetura como teste (2026-09-30) e teste de propriedade
    // com estado. Ver docs/research/2026-09-30-avaliacao-profissional-de-codigo.md.
    testImplementation "com.tngtech.archunit:archunit-junit5:${project.archunit_version}"
    testImplementation "net.jqwik:jqwik:${project.jqwik_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // Testes que leem arquivos-fonte (registro de GameTest, manifesto, teto
    // de linhas) — ADR-035 §7. Sem isto o Gradle pula o `test` quando só o
    // arquivo lido mudou, e a quebra passa verde na máquina local.
    inputs.dir('src/gametest').withPropertyName('gametestSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/main/resources').withPropertyName('mainResources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('src/main/java').withPropertyName('mainSources').withPathSensitivity(PathSensitivity.RELATIVE)

    testLogging {
        events 'passed', 'skipped', 'failed'
    }

    finalizedBy jacocoTestReport
}

// Teste de propriedade (jqwik, 2026-09-30) numa tarefa própria, e sem o
// fabric-loader-junit: o listener dele carrega as classes de teste pelo Knot,
// e o motor do jqwik não reconhece @Property vinda de outro carregador — a
// suíte rodava verde sem executar nenhuma propriedade. É o mesmo corte que o
// PIT faz abaixo. Roda no `check`, e portanto no `build` e no CI.
def propertyTest = tasks.register('propertyTest', Test) {
    description = 'Roda as propriedades jqwik do core, fora do carregador do Fabric.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter {
        !it.name.startsWith('fabric-loader-junit')
    }
    useJUnitPlatform {
        includeEngines 'jqwik'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('check') {
    dependsOn propertyTest
}

// Complexidade cognitiva (PMD, 2026-09-30), só como relatório: aponta onde
// quebrar os métodos difíceis de ler, sem reprovar. Relatório em
// build/reports/pmd/main.html. Só o código do mod.
pmd {
    toolVersion = project.pmd_version
    ignoreFailures = true
    consoleOutput = false
    ruleSets = []
    ruleSetFiles = files('config/pmd/complexity.xml')
}

tasks.named('pmdTest') { enabled = false }
tasks.matching { it.name == 'pmdGametest' }.configureEach { enabled = false }

// Cobertura (2026-09-24). Não é meta — cobertura diz o que foi executado,
// não o que foi verificado. Serve para escolher onde apontar o PIT.
// Relatório em build/reports/jacoco/test/html/index.html.
jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }
}

// Teste de mutação (2026-09-24): `./gradlew pitest`. Relatório em
// build/reports/pitest/index.html.
//
// Mede se o teste falha quando o código muda — o que o projeto fazia à mão,
// uma mutação por vez, desde o "teste vazio por condição impossível". Só o
// core: é a lógica pura, e mutar a camada fabric pediria o jogo rodando.
// O mutante sobrevivente vira tarefa de teste.
//
// <b>Limite de 85% desde 2026-09-30</b> (estava em 88%): o número deixou de
// ser só para ler e passou a barrar a regressão. Abaixo dele o CI reprova —
// a decisão de 09-25 de não ter limite foi revista com o placar medido.
// `enableDefaultIncrementalAnalysis` guarda o histórico em build/ e, na
// máquina local, só remuta o que mudou; o CI roda do zero.
pitest {
    junit5PluginVersion = '1.2.2'
    targetClasses = ['com.villagecolony.core.*']
    targetTests = ['com.villagecolony.core.*']
    // Sobe o Minecraft para percorrer as classes da camada fabric, e o PIT
    // roda sem o jogo (ver abaixo). Dentro dele o teste falha sem mutação e
    // o PIT para antes de começar — foi o que aconteceu, calado pelo
    // continue-on-error do CI, do 78e7efc ao 7619b1d. Não mata mutante do
    // core: o que ele guarda roda no `gradle test`.
    excludedTestClasses = ['com.villagecolony.core.type.ServerMemoryRegistrationTest']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 85
    enableDefaultIncrementalAnalysis = true
}

// Sem o fabric-loader-junit no classpath do PIT. O listener dele só aceita
// um launcher por JVM ("Duplicate setLauncher call!"), e o PIT abre mais de
// um; os testes do core não precisam do jogo carregado.
tasks.named('pitest').configure {
    additionalClasspath.setFrom(sourceSets.test.runtimeClasspath.filter {
        !it.name.startsWith('fabric-loader-junit')
    })
}

// `./gradlew runGametest` sobe um servidor sem cliente, monta as
// estruturas, roda as afirmações e falha o build.
//
// Existe porque a camada fabric não tinha teste nenhum, e foi nela que
// os quatro defeitos de 2026-08-07 apareceram — todos depois de uma
// sessão de jogo do autor. Ver §11.
loom {
    // Depuração de mixin em todo run de desenvolvimento (2026-09-24).
    //
    // - export: a classe final, com a injeção aplicada, sai em
    //   <runDir>/.mixin.out/class — é onde se confere o que o mixin fez.
    // - verify: a Mixin revalida o bytecode que gerou; erro de injeção
    //   aparece na carga, e não como comportamento estranho em jogo.
    // - checks.interfaces: audita se a classe alvo implementa o que a
    //   interface do mixin promete (.mixin.out/audit).
    // - dumpTargetOnFailure: se aplicar falhar, grava a classe alvo.
    //
    // Nada disto vai para o jar: são argumentos da JVM de desenvolvimento.
    runConfigs.configureEach {
        vmArg '-Dmixin.debug.export=true'
        vmArg '-Dmixin.debug.verify=true'
        vmArg '-Dmixin.checks.interfaces=true'
        vmArg '-Dmixin.dumpTargetOnFailure=true'
    }

    runs {
        gametest {
            server()
            name = 'Game Test'
            source sourceSets.gametest

            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-report.xml"

            runDir 'build/gametest'
        }
    }
}

// Cobertura da bateria de jogo (2026-10-02). O jacocoTestReport só vê os
// unitários, que mal tocam a camada fabric — e é nela que mora quase todo
// defeito visto em jogo. O agente vai na JVM do servidor de teste, só para as
// classes do mod; o Knot define as classes sem CodeSource, e sem
// includeNoLocationClasses o relatório sairia vazio.
// Relatório em build/reports/jacoco/gametest/html/index.html.
tasks.named('runGametest') {
    jacoco.applyTo(it)
    jacoco {
        includes = ['com.villagecolony.*']
        includeNoLocationClasses = true
    }
    finalizedBy 'jacocoGametestReport'
}

tasks.register('jacocoGametestReport', JacocoReport) {
    executionData layout.buildDirectory.file('jacoco/runGametest.exec')
    sourceSets sourceSets.main

    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/gametest/jacocoGametestReport.xml')
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/gametest/html')
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_api_version', project.fabric_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                fabric_api_version: project.fabric_version
        )
    }
}

// Java 21 é requisito do Minecraft 1.21.1, não preferência do projeto.
// Ver docs/technical/Fabric-Version.md §5.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21

    // Error Prone (2026-09-24) só no código do mod. Teste e teste de jogo
    // ficam de fora para o aviso não se perder no meio de asserção.
    //
    // <b>Reprova desde 2026-09-30.</b> A primeira passada era só aviso, para
    // ler; com os avisos zerados, travar custa nada e impede que o primeiro
    // volte calado — o que o PIT fez com o CI verde de 78e7efc a 7619b1d.
    it.options.errorprone.enabled = (it.name == 'compileJava')
    it.options.errorprone.allErrorsAsWarnings = false
    it.options.errorprone.disableWarningsInGeneratedCode = true
    // NullAway (2026-09-30): só nos pacotes @NullMarked (package-info).
    // Começa pelo core; a camada fabric entra pacote a pacote. Modo padrão, e
    // não o JSpecifyMode: este pede JDK 22+ ou a flag
    // -XDaddTypeAnnotationsToSymbol, que o JDK 21 da Oracle não aceita.
    it.options.errorprone.option('NullAway:OnlyNullMarked', 'true')
    it.options.errorprone.error('NullAway')
    if (it.name == 'compileJava') {
        it.options.compilerArgs += ['-Werror']
    }
    // Item e Block do Minecraft são instâncias únicas de registro: comparar
    // por == é o jeito certo, e as 28 ocorrências medidas eram todas isso.
    it.options.errorprone.disable('ReferenceEquality')
    // O javac corta em 100 avisos; sem isto o relatório mente pela metade.
    it.options.compilerArgs += ['-Xmaxwarns', '10000']
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
